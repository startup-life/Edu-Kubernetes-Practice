name: Build & Deploy to ArgoCD

on:
  push:
    branches: [ 18/argocd-cicd ]
    paths:
      - app.js
      - Dockerfile
      - '.github/workflows/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE: adapterz/k8s-pod:argocd

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: Update deployment.yaml image
        run: |
          sed -i "s|image: .*|image: $IMAGE|" ./app/demo/deployment.yaml

      - name: Commit manifest update
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add ./app/demo/deployment.yaml || true
          git diff --cached --quiet || (git commit -m "chore: update image to $IMAGE" && git push)